[project]
name = "mcp-refund-server"
version = "1.0.0"
description = "MCP server exposing customer lookup and refund tools over stdio"
requires-python = ">=3.10"
dependencies = [
    # 2.x is required: this server uses the constructor-based low-level handler
    # API (`on_list_tools` / `on_call_tool`) and the `mcp_types` module.
    "mcp>=2.1,<3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
mcp-refund-server = "mcp_refund_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_refund_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
